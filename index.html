<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>PM大管家 · 双层顶栏</title>
<style>
:root{
  --ds-color-brand:#0F28E6;--ds-color-brand-strong:#0A1B9C;--ds-color-accent:#0A1B9C;
  --ds-color-text:#181a26;--ds-color-text-muted:#595e72;--ds-color-bg:#f3f4f8;--ds-color-surface:#ffffff;
  --ds-color-border:#e7e8f0;--ds-color-overlay:rgba(24,26,38,0.88);
  --ds-color-success:#15803d;--ds-color-warning:#b45309;--ds-color-danger:#b91c1c;
  --bx-color-brand-tint:#ECEEFD;--bx-color-on-brand:#ffffff;
  --bx-dot-orange:#F0612A;--bx-dot-yellow:#FFD84A;--bx-dot-green:#8FE05A;
  --bx-gradient-sky:linear-gradient(160deg,#F8F9FE 0%,#E7EAFD 55%,#CFD4FA 100%);
  --bx-glass-bg:rgba(255,255,255,0.60);--bx-glass-bg-fallback:rgba(255,255,255,0.85);
  --bx-glass-border:rgba(255,255,255,0.70);
  --bx-glass-shadow:0 8px 24px rgba(22,29,110,0.08),inset 0 1px 0 rgba(255,255,255,0.70);
  --ds-shadow-1:0 2px 8px rgba(22,29,110,0.10);--ds-shadow-2:0 12px 32px rgba(22,29,110,0.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ds-color-bg);color:var(--ds-color-text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",Inter,sans-serif;font-size:14px;line-height:1.5;min-width:1440px}
.num{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
/* v4：内容区在左侧目录右边，宽度跟主区走（v3 是 1440 定宽居中） */
.wrap{width:auto;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button,select{cursor:pointer}
:focus-visible{outline:2px solid var(--ds-color-brand);outline-offset:2px}
.muted{color:var(--ds-color-text-muted)}
.cap{font-size:12px}
.lk{color:var(--ds-color-brand);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;font-size:inherit}

/* ===== v4 页面框架：按现有工作台（ref-a9de0ab：app.js sidebar() / shell()，styles.css）恢复 ===== */
/* 左侧目录 */
.sidebar{position:fixed;inset:0 auto 0 0;width:190px;background:var(--ds-color-surface);border-right:1px solid var(--ds-color-border);padding:29px 10px 14px;display:flex;flex-direction:column;overflow-y:auto;z-index:30;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.sidebar button{border:0;background:none;color:inherit;cursor:pointer;line-height:1.5}
.icon{width:18px;height:18px;flex:none;vertical-align:middle}
.icon-button{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:6px;color:#595e72;padding:0}
.icon-button:hover{background:var(--bx-color-brand-tint)}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 34px;text-decoration:none;color:var(--ds-color-text)}
.brand-mark{position:relative;width:39px;height:42px;display:grid;place-items:center;border-radius:11px 4px 11px 4px;background:#0f28e6;color:#ffffff;font-family:serif;font-size:26px}
.brand-mark::after{content:"";position:absolute;left:-3px;top:-3px;width:44px;height:46px;pointer-events:none;background:radial-gradient(circle at 3px 4px,var(--bx-dot-orange) 3px,transparent 3.4px),radial-gradient(circle at 18px 42px,var(--bx-dot-yellow) 3px,transparent 3.4px),radial-gradient(circle at 40px 6px,var(--bx-dot-green) 3px,transparent 3.4px)}
.brand strong{font-size:23px;letter-spacing:3px;color:var(--ds-color-brand)}
.brand small{font-size:8px;letter-spacing:2px;color:var(--ds-color-text-muted);font-weight:500;margin-left:3px}
.brand em{display:block;font-size:9px;font-style:normal;letter-spacing:3px;color:var(--ds-color-text-muted);margin-top:8px}
.sidebar .new-task{display:flex;align-items:center;gap:8px;background:var(--ds-color-brand);border:1px solid var(--ds-color-brand);color:var(--bx-color-on-brand);border-radius:8px;font-size:13px;padding:13px 14px;min-height:47px;width:100%;box-shadow:0 2px 4px #161d6e03}
.sidebar .new-task:hover{background:var(--ds-color-brand-strong)}
.new-task span{margin-left:auto;color:var(--bx-color-on-brand)}
.new-task .icon{width:16px;height:16px;color:var(--bx-color-on-brand)}
.entry-nav-section{margin-top:27px}
.entry-nav-label{display:flex;gap:6px;align-items:center;padding:0 11px 10px;font-size:10px;color:#595e72}
.sidebar .entry-nav-label>button:first-child{display:flex;gap:9px;align-items:center;padding:0;font-size:11px}
.entry-nav-label>button:first-child .icon{width:14px;height:14px}
.entry-nav-label>span{margin-left:auto}
.entry-nav-label>.icon-button{width:23px;height:23px;margin-right:-4px}
.entry-nav-label>.icon-button .icon{width:14px;height:14px}
.sidebar .project-nav{display:flex;align-items:center;gap:10px;padding:10px 11px 10px 16px;height:42px;margin:3px 0;width:100%;text-align:left;font-size:12px;border-radius:6px;color:#595e72}
.project-nav .icon{width:16px;height:16px}
.project-nav span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-nav .icon:last-child{width:12px;height:12px;color:#595e72}
.sidebar .project-nav.selected{background:var(--bx-color-brand-tint);color:var(--ds-color-brand);font-weight:600;box-shadow:inset 3px 0 0 var(--ds-color-brand);padding-left:16px}
.sidebar .sidebar-recents button{display:flex;align-items:center;gap:9px;padding:10px;text-align:left;width:100%;font-size:11px;color:#595e72;border-radius:5px}
.sidebar-recents button>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-recents strong{display:block;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:400;line-height:1.6}
.sidebar-recents small{display:block;overflow:hidden;text-overflow:ellipsis;font-size:9px;color:#595e72;margin-top:3px}
.sidebar .project-nav:hover,.sidebar .sidebar-recents button:hover{background:#f3f4f8}
.sidebar .project-nav.selected:hover{background:var(--bx-color-brand-tint)}
.mini-dot{width:4px;height:4px;flex:none;border-radius:50%;background:#f3f4f8}
.mini-dot.green{background:#f3f4f8}
.mini-dot.amber{background:#b45309}
.sidebar-bottom{margin-top:auto;padding-top:20px}
.user-account{position:relative;border-top:1px solid #e7e8f0;padding-top:12px}
.user-account-row{display:flex;align-items:center;gap:3px}
.sidebar .user-account-trigger{display:flex;align-items:center;gap:9px;min-width:0;flex:1;padding:7px 4px;text-align:left;border-radius:8px}
.user-account-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.user-avatar{position:relative;display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:#eceefd;color:#0f28e6;border:1px solid #e7e8f0;overflow:hidden;font-size:13px}
.user-settings{display:grid;place-items:center;width:30px;height:32px;border-radius:7px;flex:none;color:var(--ds-color-text)}
.user-settings:hover{background:#f3f4f8}
.user-settings .icon{margin:0;width:16px;height:16px}
/* 主区：顶栏 + 内容 */
.main-shell{margin-left:190px;min-height:100vh;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:none!important}
.main-body{flex:1;min-width:0;min-height:0;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.topbar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:10px;gap:8px;background:var(--ds-color-brand);color:var(--bx-color-on-brand);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.breadcrumbs{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;color:var(--bx-color-on-brand);font-size:10px;line-height:1;min-width:0}
.breadcrumbs strong{font-weight:600;color:var(--bx-color-on-brand)}
.breadcrumbs .icon{width:9px;height:9px;color:var(--bx-color-on-brand);opacity:.75}
.topbar-right{display:flex;align-items:center;gap:6px;min-width:0;flex:none}
.preview-label{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:9px;color:rgba(255,255,255,.8)}
.preview-dot{width:6px;height:6px;display:inline-block;border-radius:50%;background:var(--bx-color-on-brand)}
.topbar-right .user-avatar{width:18px;height:18px;font-size:9px;background:var(--ds-color-surface);color:var(--ds-color-brand);border-color:transparent}
.topbar :focus-visible{outline-color:#fff}
.flag-on-brand{background:#fff;color:var(--ds-color-brand);font-size:12px;font-weight:700;height:24px;padding:0 8px;border-radius:4px;display:inline-flex;align-items:center}
.appr-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.6);color:#fff;height:32px;border-radius:9999px;padding:0 12px;font-size:12px;font-weight:500}
.appr-btn b{background:#fff;color:var(--ds-color-brand);border-radius:9999px;padding:0 6px;margin-left:4px}
.idsel{height:32px;border-radius:4px;border:1px solid rgba(255,255,255,.6);background:var(--ds-color-brand-strong);color:#fff;padding:0 8px;font-size:12px}
footer{display:none!important}

/* demo route/flags removed */

/* 页头 */
.hero{background:var(--bx-gradient-sky)}
.hero .wrap{padding:24px 32px}
.crumb{font-size:14px;margin-bottom:4px}
h1{font-size:30px;line-height:1.3;margin:0;font-weight:700;display:flex;align-items:center;gap:12px}
h2{font-size:20px;margin:0;font-weight:700}
h3{font-size:14px;margin:0;font-weight:700}
.hero-row{display:flex;align-items:flex-start;gap:24px}
.hero-row .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.glass{background:var(--bx-glass-bg);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--bx-glass-border);box-shadow:var(--bx-glass-shadow);border-radius:16px;padding:24px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--bx-glass-bg-fallback)}}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--bx-glass-bg-fallback);backdrop-filter:none;-webkit-backdrop-filter:none}}
.gsum{display:flex;align-items:center;gap:48px;margin-top:16px}
.gsum .it{font-size:14px;color:var(--ds-color-text-muted)}
.gsum .it b{display:block;font-size:30px;color:var(--ds-color-accent);font-weight:700;line-height:1.2}
.gsum .txt{font-size:14px;max-width:620px}
.meta{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px;margin-top:12px;align-items:center}

/* 按钮 */
.btn{height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:500;border:0;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px}
.btn-pri{background:var(--ds-color-brand);color:#fff}.btn-pri:hover{background:var(--ds-color-brand-strong)}
.btn-sec{background:#fff;color:var(--ds-color-brand);border:1px solid var(--ds-color-brand)}.btn-sec:hover{background:var(--bx-color-brand-tint)}
.btn-txt{background:none;color:var(--ds-color-brand);padding:0 8px}.btn-txt:hover{text-decoration:underline}
.btn-dan{background:var(--ds-color-danger);color:#fff}
.btn:disabled{background:var(--ds-color-border);color:var(--ds-color-text-muted);border:0;cursor:not-allowed;text-decoration:none}
.btn-sec.on{background:var(--bx-color-brand-tint);font-weight:700}

/* 页签 */
.tabs{background:#fff;border-bottom:1px solid var(--ds-color-border)}
.tabs .wrap{display:flex;align-items:center;gap:24px;padding:0 32px;height:48px}
.tabs button{background:none;border:0;height:48px;padding:0;color:var(--ds-color-text-muted);font-weight:500;position:relative;white-space:nowrap}
.tabs button.cur{color:var(--ds-color-brand);font-weight:700}
.tabs button.cur::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ds-color-brand)}
.tabs .sep{width:1px;height:20px;background:var(--ds-color-text-muted);opacity:.4}
.tabs .note{margin-left:auto;font-size:12px;color:var(--ds-color-text-muted);white-space:nowrap}

.tabs .more-wrap{position:relative}
.tabs .more-btn{display:inline-flex;align-items:center;gap:4px}
.tabs .more-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:280px;background:#fff;border:1px solid var(--ds-color-border);border-radius:10px;box-shadow:var(--ds-shadow-2);padding:8px;z-index:50}
.tabs .more-menu .mh{font-size:12px;color:var(--ds-color-text-muted);padding:6px 10px 8px}
.tabs .more-menu button.role-item{display:flex;width:100%;text-align:left;height:auto;padding:10px 12px;border-radius:8px;color:var(--ds-color-text);font-weight:500}
.tabs .more-menu button.role-item:hover{background:#F5F6FA}
.tabs .more-menu button.role-item.cur{background:#EEF2FF;color:var(--ds-color-brand);font-weight:700}
.tabs .more-menu button.role-item span.sub{display:block;font-size:12px;color:var(--ds-color-text-muted);font-weight:400;margin-top:2px}
.work-wall .pin-hint{margin:0 0 12px;font-size:13px;color:var(--ds-color-text-muted)}
.work-card .pin-act{margin-top:10px}
.work-card .pin-act .btn{pointer-events:auto}


main .wrap{padding:32px 32px 48px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sec-h .m{color:var(--ds-color-text-muted)}
.sec-h .right{margin-left:auto}
.card{background:#fff;border:1px solid var(--ds-color-border);border-radius:8px}
.card:hover{box-shadow:var(--ds-shadow-1)}
.pad{padding:24px}

/* 标签与状态灯 */
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:500;white-space:nowrap}
.t-neu{background:var(--ds-color-bg);color:var(--ds-color-text-muted)}
.t-brand{background:var(--bx-color-brand-tint);color:var(--ds-color-brand)}
.t-ok{background:#fff;color:var(--ds-color-success);border:1px solid var(--ds-color-success)}
.t-warn{background:#fff;color:var(--ds-color-warning);border:1px solid var(--ds-color-warning)}
.t-bad{background:#fff;color:var(--ds-color-danger);border:1px solid var(--ds-color-danger)}
.t-grey{background:#fff;color:var(--ds-color-text-muted);border:1px solid var(--ds-color-text-muted)}
.lamp{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;font-weight:500}
.lamp::before{content:"";width:8px;height:8px;border-radius:9999px;box-shadow:0 0 0 2px #fff;background:currentColor}
.s-ok{color:var(--ds-color-success)}.s-warn{color:var(--ds-color-warning)}.s-bad{color:var(--ds-color-danger)}.s-run{color:var(--ds-color-brand)}.s-grey{color:var(--ds-color-text-muted)}
@keyframes pulse{50%{opacity:.35}}
.s-run::before{animation:pulse 2s infinite}
@media (prefers-reduced-motion:reduce){.s-run::before{animation:none}}
.lockt{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:4px;font-size:12px;background:var(--ds-color-bg);color:var(--ds-color-text-muted);font-weight:500;white-space:nowrap}

/* 搭子卡 */
.bots{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.botcard{padding:24px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.botcard .t{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:9999px;background:var(--bx-color-brand-tint);color:var(--ds-color-brand);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.av.sm{width:24px;height:24px;font-size:12px}
.av.h{background:var(--ds-color-bg);color:var(--ds-color-text)}
.botcard h3{font-size:20px;color:var(--ds-color-brand)}
.botcard dl{display:grid;grid-template-columns:84px 1fr;gap:4px 8px;margin:0;font-size:12px}
.botcard dt{color:var(--ds-color-text-muted)}
.botcard dd{margin:0}
.botcard .f{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--ds-color-border);font-size:12px}
.botcard .f .r{margin-left:auto}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}
.legend ul{margin:8px 0 0;padding-left:20px}

/* 表格 */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{background:var(--ds-color-bg);color:var(--ds-color-text-muted);font-weight:500;text-align:left;padding:0 12px;height:40px}
.tb td{padding:8px 12px;height:44px;border-top:1px solid var(--ds-color-border);vertical-align:top}
.tb .r{text-align:right;font-family:Inter,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums}
.tb tbody tr:hover{background:var(--bx-color-brand-tint)}
.tb tr.sel{background:var(--bx-color-brand-tint);box-shadow:inset 3px 0 0 var(--ds-color-brand)}

/* skill 列表 */
.sklist{display:flex;flex-direction:column;gap:12px}
.sk{display:flex;gap:16px;align-items:center;padding:16px 24px}
.sk .x{flex:1}
.sk .x b{font-size:14px;color:var(--ds-color-brand)}
.sk .st{display:flex;gap:24px;font-size:12px;color:var(--ds-color-text-muted)}
.sk .st b{font-size:14px;color:var(--ds-color-accent);display:block;font-weight:700}
.sk.plat{background:var(--ds-color-bg);border-style:dashed}
.sk.plat .x b{color:var(--ds-color-text)}
.banner-ro{margin-bottom:24px;padding:12px 16px;background:#fff;border:1px solid var(--ds-color-border);border-left:3px solid var(--ds-color-text-muted);border-radius:8px}
.banner-in{margin-bottom:24px;padding:12px 16px;background:var(--bx-color-brand-tint);border-left:3px solid var(--ds-color-brand);border-radius:8px;display:flex;gap:16px;align-items:center}
.banner-in .x{flex:1}

/* 工作室 */
.steps{display:flex;gap:8px;margin-bottom:24px}
.steps button{flex:1;height:40px;border-radius:8px;background:var(--ds-color-bg);color:var(--ds-color-text-muted);border:0;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:500;gap:8px}
.steps button.cur{background:var(--ds-color-brand);color:#fff}
.steps button.done{background:var(--bx-color-brand-tint);color:var(--ds-color-brand)}
.studio{display:grid;grid-template-columns:1fr 360px;gap:24px}
.fl{display:block;font-size:14px;font-weight:500;margin:16px 0 8px}
.fl:first-child{margin-top:0}
.inp,.sel,textarea.inp{width:100%;height:40px;border:1px solid var(--ds-color-text-muted);border-radius:4px;padding:0 12px;background:#fff}
textarea.inp{height:72px;padding:8px 12px;resize:vertical}
.inp:focus,.sel:focus{outline:none;border:2px solid var(--ds-color-brand)}
.inp:disabled,.sel:disabled{background:var(--ds-color-bg);color:var(--ds-color-text-muted)}
.inp.err{border-color:var(--ds-color-danger)}
.errt{font-size:12px;color:var(--ds-color-danger);margin-top:4px}
.okt{font-size:12px;color:var(--ds-color-success);margin-top:4px}
.help{font-size:12px;color:var(--ds-color-text-muted);margin-top:4px}
.li-ed{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ds-color-border)}
.li-ed .n{width:24px;height:24px;border-radius:9999px;background:var(--ds-color-bg);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.li-ed .x{flex:1}
.li-ed.new{background:var(--bx-color-brand-tint)}
.addrow{display:flex;gap:8px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{height:28px;border:1px solid var(--ds-color-text-muted);border-radius:9999px;background:#fff;font-size:12px;padding:0 12px}
.chips button:hover{background:var(--bx-color-brand-tint)}
.chk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border:1px solid var(--ds-color-border);border-radius:8px;cursor:pointer}
.chk label.on{border-color:var(--ds-color-brand);background:var(--bx-color-brand-tint)}
.chk label small{display:block;font-size:12px;color:var(--ds-color-text-muted)}
input[type=checkbox],input[type=radio]{accent-color:var(--ds-color-brand);width:16px;height:16px;margin-top:2px;flex:none}
.side h3{margin-bottom:8px}
.side .card{padding:16px;margin-bottom:16px}
.side ul{margin:0;padding-left:18px;font-size:12px}
.test{border:1px solid var(--ds-color-border);border-radius:8px;padding:16px;margin-bottom:12px}
.test .h{display:flex;gap:8px;align-items:center}
.test .h .r{margin-left:auto}
.diff{border:1px solid var(--ds-color-border);border-radius:8px;margin-top:16px}

/* 项目群 */
.grp{display:grid;grid-template-columns:240px 1fr 380px;gap:24px;align-items:start}

.msg{display:flex;gap:12px;max-width:92%}

.tcard dl{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin:0;font-size:12px}

.tcard dd{margin:0}
.tcard .tf{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--ds-color-border);background:var(--ds-color-bg);border-radius:0 0 8px 8px;flex-wrap:wrap}

.prog{display:flex;gap:4px;margin:8px 0}

.prog span.done{background:var(--bx-color-brand-tint);color:var(--ds-color-brand)}
.prog span.cur{background:var(--ds-color-brand);color:#fff;font-weight:700}
.prog span.stop{background:#fff;color:var(--ds-color-warning);border:1px solid var(--ds-color-warning);font-weight:700}
.prog span.bad{background:#fff;color:var(--ds-color-danger);border:1px solid var(--ds-color-danger);font-weight:700}
.last{list-style:none;margin:8px 0 0;padding:0;font-size:12px;color:var(--ds-color-text-muted)}

.board .bh .r{margin-left:auto}

.bitem .s{font-size:12px;color:var(--ds-color-text-muted)}
.bitem.new{background:var(--bx-color-brand-tint)}
.apcard{border:1px solid var(--ds-color-border);border-left:3px solid var(--ds-color-warning);border-radius:8px;padding:16px;background:#fff}

/* 今日一页 · 事项反馈原型（Apple HIG：浅边框、软阴影、无重气泡） */
.tday-page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:0 0 16px}

.tday-layout-switch button:hover:not(.is-on){color:#1C1C1E}
/* A：左栏自滚吃满剩余视口；右话题栏同高自滚；禁整页滑 */
.main-shell:has(main.is-tday-a){height:100vh;max-height:100vh;overflow:hidden}

/* 今日一页顶：全项目「项目消耗」固定块（非岗上生成看板） */
.tday-spend{flex:none;margin:0 0 10px;padding:12px 14px;border:1px solid rgba(60,60,67,.1);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}

.tday-spend.is-collapsed .tday-spend-hd{margin:0}
.tday-spend-hd:hover h3{color:#0A60C7}
.tday-spend-hd-l{display:inline-flex;align-items:center;gap:6px;min-width:0}
.tday-spend-chev{display:inline-flex;width:14px;height:14px;align-items:center;justify-content:center;color:#8E8E93;font-size:14px;line-height:1;transform:rotate(0deg);transition:transform .16s ease;flex:none}
.tday-spend:not(.is-collapsed) .tday-spend-chev{transform:rotate(90deg)}
.tday-spend-hd h3{margin:0;font-size:13px;font-weight:650;color:#1C1C1E;letter-spacing:-.01em}
.tday-spend-hd .cap{font-size:11px;color:#8E8E93;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.tday-spend-body{min-width:0}
.tday-spend.is-collapsed .tday-spend-body{display:none}
.tday-spend-cell{min-width:0;padding:12px 14px;border-radius:12px;background:#F7F7F8;border:1px solid rgba(60,60,67,.05);display:flex;flex-direction:column}
.tday-spend-lab{font-size:11px;font-weight:500;color:#8E8E93;letter-spacing:.01em;margin:0 0 6px}
.tday-spend-val{font-size:20px;font-weight:700;color:#1C1C1E;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums}
.tday-spend-val .unit{font-size:12px;font-weight:500;color:#8E8E93;letter-spacing:0;margin-left:4px}
.tday-spend-val .muted{font-weight:500;color:#8E8E93}
.tday-spend-bar{height:8px;border-radius:999px;background:rgba(60,60,67,.10);overflow:hidden}
.tday-spend-bar>i{display:block;height:100%;border-radius:999px;background:#007AFF;min-width:0}
.tday-spend-bar.is-time>i{background:rgba(60,60,67,.22)}
.tday-spend-bar.is-empty{background:rgba(60,60,67,.07)}
.tday-spend-bar.is-k>i{background:#5856D6}
.tday-spend-bar.is-f>i{background:#007AFF}
.tday-spend-bar.is-s>i{background:#30B0C7}
.tday-spend-stack{display:flex;height:10px;border-radius:999px;background:rgba(60,60,67,.08);overflow:hidden;gap:1px}
.tday-spend-stack>i{display:block;height:100%;min-width:0;flex:none}
.tday-spend-stack>i.is-k{background:#5856D6}
.tday-spend-stack>i.is-f{background:#007AFF}
.tday-spend-stack>i.is-s{background:#30B0C7}
.tday-spend-leg{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:7px;font-size:11px;color:#8E8E93;font-weight:500}
.tday-spend-leg span{display:inline-flex;align-items:center;gap:5px}
.tday-spend-leg i{width:8px;height:8px;border-radius:2px;flex:none}
.tday-spend-leg i.is-k{background:#5856D6}
.tday-spend-leg i.is-f{background:#007AFF}
.tday-spend-leg i.is-s{background:#30B0C7}
.tday-spend-dual{display:flex;flex-direction:column;gap:7px;margin-top:12px}.tday-spend-dual>.tday-spend-leg{margin-left:60px}
.tday-spend-dual-row{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:8px}
.tday-spend-dual-row .k{font-size:11px;color:#8E8E93}
.tday-spend-dual-row .n{font-size:11px;font-weight:600;color:#3A3A3C;text-align:right;font-variant-numeric:tabular-nums}
.tday-spend-dual-row .n.is-miss{font-weight:500;color:#8E8E93}
.tday-spend-buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(60,60,67,.08)}

.tday-spend-bkt{min-width:0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.72);border:1px solid rgba(60,60,67,.06);display:flex;flex-direction:column}

.tday-spend-bkt.is-f{border-color:rgba(0,122,255,.22);background:rgba(0,122,255,.05)}
.tday-spend-bkt.is-s{border-color:rgba(48,176,199,.22);background:rgba(48,176,199,.06)}
.tday-spend-bkt.is-k .tday-spend-lab{color:#4845C7}
.tday-spend-bkt.is-f .tday-spend-lab{color:#0A60C7}
.tday-spend-bkt.is-s .tday-spend-lab{color:#0F7A8A}
.tday-spend-bkt .tday-spend-lab{margin:0 0 4px}
.tday-spend-bkt .tday-spend-val{font-size:15px}
.tday-spend-bkt .tday-spend-dual{margin-top:10px;gap:6px}
.tday-spend-bkt .tday-spend-bar{height:6px}
.tday-spend-bkt .tday-spend-dual-row{grid-template-columns:72px 1fr 40px;gap:6px}

.work-badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;line-height:1.4}
.work-badge.ai{background:#FEE2E2;color:#B91C1C;border:1px solid #FECACA}
.work-badge.todo{background:#E2E8F0;color:#64748B;border:1px solid #CBD5E1}
.work-back{display:inline-flex;align-items:center;gap:4px;margin-bottom:12px}
.kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.kv{font-size:30px;font-weight:700;color:var(--ds-color-accent);line-height:1.3}

.biz-shell .pipe{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 互派链 */

.evt{list-style:none;margin:8px 0 0;padding:0;font-size:12px}
.evt li{padding:6px 0;border-bottom:1px solid var(--ds-color-border);display:flex;gap:8px}

/* 遮罩、抽屉、弹窗 */

/* overlay: empty layer never captures clicks */
#layer{pointer-events:none}
#layer:has(.lwrap){pointer-events:auto}
.ov{pointer-events:auto}
.ov{position:fixed;inset:0;background:var(--ds-color-overlay);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:760px;background:#fff;z-index:41;box-shadow:var(--ds-shadow-2);display:flex;flex-direction:column}
.dr-h{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--ds-color-border)}
.dr-tabs{display:flex;gap:24px;padding:0 24px;border-bottom:1px solid var(--ds-color-border)}
.dr-tabs button{background:none;border:0;height:44px;padding:0;color:var(--ds-color-text-muted);font-weight:500;position:relative}
.dr-tabs button.cur{color:var(--ds-color-brand);font-weight:700}
.dr-tabs button.cur::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ds-color-brand)}
.dr-b{flex:1;overflow:auto;padding:24px}
.modal{position:fixed;left:50%;top:48px;transform:translateX(-50%);width:880px;max-height:calc(100vh - 96px);overflow:auto;background:#fff;border-radius:16px;z-index:41;box-shadow:var(--ds-shadow-2)}
.modal .mh{display:flex;align-items:center;gap:12px;padding:24px 32px 16px}
.modal .mb{padding:0 32px 24px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:16px 32px;border-top:1px solid var(--ds-color-border);background:var(--ds-color-bg);border-radius:0 0 16px 16px;position:sticky;bottom:0}
.modal .mf .l{margin-right:auto;font-size:12px;color:var(--ds-color-text-muted);align-self:center}
.xbtn{width:32px;height:32px;border:0;background:none;border-radius:4px;font-size:20px;color:var(--ds-color-text-muted);margin-left:auto}
.xbtn:hover{background:var(--ds-color-bg)}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ds-color-overlay);color:#fff;padding:12px 24px;border-radius:8px;z-index:60;font-size:14px;max-width:820px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:56px 28px 1fr;gap:8px;padding:8px 0;align-items:start}
.tl .tm{font-size:12px;color:var(--ds-color-text-muted);padding-top:2px}
.tl .who{font-weight:700}
.tl .det{font-size:12px;color:var(--ds-color-text-muted);margin-top:2px}
.tl li.stop .x{color:var(--ds-color-warning)}
.tl li.bad .x{color:var(--ds-color-danger)}
.tl li.dlv .x{color:var(--ds-color-brand)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:24px}
.kpi .kd{font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.item{border:1px solid var(--ds-color-border);border-radius:8px;padding:16px 24px;margin-bottom:12px}
.item .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--ds-color-border)}
.checks li:last-child{border-bottom:0}
.ok{color:var(--ds-color-success);font-weight:700}.no{color:var(--ds-color-danger);font-weight:700}.pend{color:var(--ds-color-text-muted);font-weight:700}

/* variant banner */
.variant-banner{position:sticky;top:0;z-index:200;background:#0F172A;color:#F8FAFC;font-size:13px;padding:8px 32px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #38BDF8}
.variant-banner b{color:#38BDF8;font-size:14px}
.variant-banner .tagv{background:#1E293B;border:1px solid #334155;border-radius:999px;padding:2px 10px;font-size:12px;color:#CBD5E1}





/* 今日一页 ≠ 作品：锚在 chip 轨外 */
.tabs .daily-anchor{flex:none;margin-right:2px}
.tabs .daily-sep{width:1px;height:24px;background:#CBD5E1;opacity:.9;margin:0 4px}
.tabs .role-seg{display:inline-flex;align-items:center;gap:0;flex:none;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;background:#F8FAFC;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tabs .role-cap{flex:none;font-size:10px;font-weight:700;letter-spacing:.08em;color:#94A3B8;margin-right:2px;user-select:none}
.tabs .tab-role{height:34px;padding:0 18px;margin:0;border:0;border-right:1px solid #E2E8F0;border-radius:0;background:transparent;color:#475569;font-size:13px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.tabs .tab-role:last-child{border-right:0}
.tabs .tab-role:hover{background:#EEF2FF;color:var(--ds-color-brand)}
.tabs .tab-role.cur{background:var(--ds-color-brand);color:#fff;font-weight:700}
.tabs .tab-role.cur:hover{background:var(--ds-color-brand);color:#fff}
.tabs .works-slot{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
.tabs .works-lab{min-width:28px}
.tabs .chips-rail.drag-over{background:#EEF2FF;border-color:var(--ds-color-brand);border-style:dashed}
.tabs .chips-rail.is-empty{border-style:dashed}

/* ===== 双层顶栏 · 作品 chip 轨（可拖自定义）===== */
.tabs.tabs-tworow{height:auto;border-bottom:1px solid var(--ds-color-border);background:#fff}
.tabs.tabs-tworow .wrap-tworow{display:block;padding:0;height:auto}
.tabs.tabs-tworow .tab-row{display:flex;align-items:center;gap:10px;padding:0 32px;min-height:48px}
.tabs.tabs-tworow .tab-row.row-main{border-bottom:1px solid #EEF2F7;min-height:56px;gap:12px;padding-top:6px;padding-bottom:6px}
.tabs.tabs-tworow .tab-row.row-sec{min-height:40px;background:#F8FAFC}
.tabs.tabs-tworow .tab-row .row-lab{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;color:#94A3B8;margin-right:4px;min-width:36px}
.tabs .slot-main{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 8px;border-radius:12px;flex:1 1 auto;min-width:0;border:1px dashed transparent;transition:background .12s,border-color .12s}
.tabs .slot-main.drag-over{background:#EEF2FF;border-color:var(--ds-color-brand)}
.tabs .slot-main.is-empty{border-color:#CBD5E1;background:#FAFBFC}
.tabs .slot-main .drop-hint{font-size:11px;color:#94A3B8;padding:0 6px;white-space:nowrap}
.tabs .chips-rail{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;overflow-x:auto;padding:4px 6px;min-height:40px;border-radius:12px;background:linear-gradient(180deg,#F8FAFC 0%,#F1F5F9 100%);border:1px solid #E2E8F0}
.tabs .slot-main.is-empty .chips-rail{border-style:dashed;background:#FAFBFC}
.tabs .tab-anchor{font-size:14px;font-weight:800;height:38px;min-width:108px;padding:0 18px;border-radius:10px;flex:none;background:#0F172A;color:#F8FAFC;border:0;box-shadow:0 2px 6px rgba(15,23,42,.28);cursor:pointer;letter-spacing:.02em}
.tabs .tab-anchor.cur{background:var(--ds-color-brand);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.4)}
.tabs .tab-anchor.cur::after{display:none}
.tabs .tab-anchor .num{color:inherit;opacity:.85}
.tabs .tab-chip{cursor:grab;user-select:none;-webkit-user-select:none;height:34px;padding:0 12px 0 8px;margin:0;border-radius:999px;border:1px solid #CBD5E1;background:#fff;color:#334155;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;min-width:76px;justify-content:center;position:relative;box-shadow:0 1px 2px rgba(15,23,42,.06);transition:transform .12s,box-shadow .12s,opacity .12s,border-color .12s}
.tabs .tab-chip:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(15,23,42,.12);border-color:#94A3B8}
.tabs .tab-chip:active{cursor:grabbing;transform:translateY(0)}
.tabs .tab-chip.dragging{opacity:.35;transform:scale(.96)}
.tabs .tab-chip.cur{border-color:var(--ds-color-brand);background:#EEF2FF;color:var(--ds-color-brand);font-weight:700;box-shadow:0 0 0 2px rgba(37,99,235,.16),0 2px 8px rgba(37,99,235,.12)}
.tabs .tab-chip.cur::after{display:none}
.tabs .tab-chip .grip{flex:none;width:10px;height:16px;display:inline-grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:2px 3px;align-content:center;justify-items:center;opacity:.55}
.tabs .tab-chip .grip i{width:3px;height:3px;border-radius:50%;background:currentColor;display:block}
.tabs .tab-chip:hover .grip{opacity:.9}
.tabs .add-chip{height:34px;padding:0 12px;border-radius:999px;border:1px dashed #94A3B8;background:transparent;color:#64748B;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;flex:none}
.tabs .add-chip:hover,.tabs .add-chip.open{border-color:var(--ds-color-brand);color:var(--ds-color-brand);background:#EEF2FF;border-style:solid}
.tabs .slot-sec{display:flex;align-items:center;gap:2px;flex:1}
.tabs .slot-sec.slot-sec-end{flex:none;margin-left:auto;gap:4px}
.tabs.tabs-onerow .tab-row.row-main{border-bottom:0;min-height:40px;gap:10px;padding-top:2px;padding-bottom:2px}
.tabs.tabs-onerow .tab-row.row-sec,.tabs.tabs-onerow .row-lab{display:none}
.tabs.tabs-onerow .tab-anchor{height:30px;min-width:92px;padding:0 12px;font-size:13px;border-radius:8px;box-shadow:none}
.tabs.tabs-onerow .tab-role{height:30px;padding:0 14px;font-size:12px}
.tabs.tabs-onerow .slot-sec button.tab-sec{height:28px;font-size:11px;padding:0 8px}
.tabs .slot-sec button.tab-sec{position:relative;height:36px;padding:0 10px;font-size:12px;font-weight:500;color:#94A3B8;border-radius:6px;background:none;border:0;box-shadow:none}
.tabs .slot-sec button.tab-sec:hover{color:#64748B;background:#EEF2F7}
.tabs .slot-sec button.tab-sec.cur{color:var(--ds-color-brand);font-weight:700;background:transparent;box-shadow:none}
.tabs .slot-sec button.tab-sec.cur::after{content:"";position:absolute;left:10px;right:10px;bottom:4px;height:2px;background:var(--ds-color-brand)}
.tabs .more-wrap{position:relative;flex:none}
.tabs .more-btn{height:34px;padding:0 12px 0 10px;border-radius:10px;border:1px solid #CBD5E1;background:#FFF7ED;font-size:12px;font-weight:700;color:#9A3412;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(154,52,18,.08)}
.tabs .more-btn::before{content:"";width:14px;height:12px;border:1.5px solid currentColor;border-radius:3px;box-sizing:border-box;opacity:.85;background:linear-gradient(180deg,transparent 40%,currentColor 40%,currentColor 48%,transparent 48%)}
.tabs .more-btn.cur,.tabs .more-btn:hover{border-color:#EA580C;background:#FFEDD5;color:#C2410C}
.tabs .more-wrap.drag-over .more-btn,.tabs .more-drop.drag-over{outline:2px dashed #D97706;background:#FEF3C7}

.codex-bridge-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.codex-bridge-form textarea{width:100%;min-height:76px;padding:10px 12px;border:1px solid var(--ds-color-border);border-radius:8px;background:var(--ds-color-surface);resize:vertical}
.codex-bridge-send{height:40px;padding:0 18px;border:0;border-radius:8px;background:var(--ds-color-brand);color:#fff;font-weight:600}
.codex-bridge-send:hover{background:var(--ds-color-brand-strong)}
.codex-bridge-send:disabled{background:var(--ds-color-border);color:var(--ds-color-text-muted);cursor:not-allowed}
.codex-bridge-status{min-height:20px;margin-top:10px;color:var(--ds-color-text-muted)}
.codex-bridge-log{max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;border:1px solid var(--ds-color-border);border-radius:8px;background:#F8F9FC;color:var(--ds-color-text-muted);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}


/* 关键节点整行可点 */
.tday-field.is-nodes{cursor:pointer;border-radius:8px;transition:background .12s,box-shadow .12s}
.tday-field.is-nodes:hover{background:rgba(139,92,246,.06);box-shadow:0 0 0 4px rgba(139,92,246,.06)}
.tday-field.is-nodes:active{background:rgba(139,92,246,.12);box-shadow:0 0 0 4px rgba(139,92,246,.12)}
.tday-field.is-nodes:focus-visible{outline:2px solid rgba(139,92,246,.45);outline-offset:3px}
.tday-field.is-nodes .tday-flab.is-sum{pointer-events:none}
/* 原文小按钮（真跳飞书群） */
.tday-src-btn{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;color:#0A60C7;text-decoration:none;padding:2px 7px;border-radius:999px;border:1px solid rgba(10,96,199,.22);line-height:16px}
.tday-src-btn:hover{background:rgba(10,96,199,.08)}
.tday-src-btn .ico{width:11px;height:11px}
.tday-meta{width:100%}
/* 问大管家悬浮球 */
.pmask{position:fixed;right:20px;bottom:96px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.pmask>*{pointer-events:auto}
.pmask-fab{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:0;border-radius:999px;background:#1C1C1E;color:#fff;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.pmask-fab svg{width:15px;height:15px}
.pmask-fab:hover{background:#2C2C2E}.pmask-fab.is-open{background:#007AFF}
.pmask-panel{width:320px;max-height:58vh;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.18);border:1px solid rgba(60,60,67,.12);overflow:hidden}
.pmask-hd{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px 8px;border-bottom:1px solid rgba(60,60,67,.08)}
.pmask-hd b{font-size:14px;color:#1C1C1E}.pmask-sub{font-size:11px;color:#8E8E93;margin-top:2px}
.pmask-x{border:0;background:transparent;font-size:18px;color:#8E8E93;cursor:pointer;line-height:1}
.pmask-body{padding:10px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.pmask-q{align-self:flex-end;max-width:85%;background:#007AFF;color:#fff;font-size:12.5px;padding:6px 10px;border-radius:12px 12px 4px 12px}
.pmask-a{align-self:flex-start;max-width:92%;background:#F2F2F7;color:#1C1C1E;font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:12px 12px 12px 4px;margin-bottom:4px}
.pmask-src{font-size:10.5px;color:#8E8E93;margin-top:3px}
.pmask-foot{padding:8px 10px;border-top:1px solid rgba(60,60,67,.08)}
.pmask-inp{width:100%;box-sizing:border-box;border:1px solid rgba(60,60,67,.18);border-radius:999px;padding:6px 12px;font-size:12.5px;outline:none}

/* ===== 今日一页 · 手动事项增改 ===== */
.tday-add-bar{margin:0 0 10px 0}
.tday-add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:36px;border:1.5px dashed rgba(0,122,255,.45);border-radius:10px;background:rgba(255,255,255,.82);color:#007AFF;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s ease;box-sizing:border-box}
.tday-add-btn:hover{background:#fff;border-color:#007AFF;box-shadow:0 4px 14px rgba(0,122,255,.14);transform:translateY(-1px)}
.tday-add-panel{margin:0 0 12px 0;padding:12px 14px 14px;border-radius:12px;background:#fff;border:1.5px solid rgba(0,122,255,.35);box-shadow:0 6px 18px rgba(0,122,255,.08);box-sizing:border-box}
.tday-add-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tday-add-title{font-size:13.5px;color:#1c1c1e}
.tday-add-ai-box{background:#F7F9FC;border-radius:8px;padding:8px 10px;margin-bottom:10px;border:1px solid rgba(0,122,255,.15)}

.tday-add-ai-row{display:flex;gap:6px}
.tday-add-ai-row input{flex:1;height:28px;font-size:12px}
.tday-add-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tday-add-chip{font-size:11px;color:#007AFF;background:rgba(0,122,255,.08);padding:2px 8px;border-radius:999px;cursor:pointer;border:1px solid rgba(0,122,255,.2);transition:all .15s ease}

.tday-add-form .form-row{margin-bottom:8px}

.tday-add-form .inp:focus{border-color:#007AFF;box-shadow:0 0 0 2px rgba(0,122,255,.15)}
.tday-add-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(60,60,67,.08)}

/* 回复框可改预览卡 */
.tday-reply-draft-card{margin:10px 14px 12px;padding:12px 14px 14px;border-radius:12px;background:#F9FBFF;border:1.5px solid #007AFF;box-shadow:0 6px 18px rgba(0,122,255,.1)}
.tday-draft-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.badge-draft{display:inline-block;padding:1px 6px;border-radius:4px;background:#007AFF;color:#fff;font-size:10.5px;font-weight:600;margin-right:6px}

.draft-row{margin-bottom:8px}
.draft-lbl{display:block;font-size:11px;font-weight:600;color:#6e6e73;margin-bottom:3px}
.tday-reply-draft-card .inp{width:100%;box-sizing:border-box;height:30px;font-size:12px;padding:4px 8px;border:1px solid rgba(60,60,67,.2);border-radius:6px;background:#fff;outline:none}

function parseDueDate(text){
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();
  const currentDate = now.getDate();
  const currentDayOfWeek = now.getDay();
  let m = String(text || '').match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})[日号]?/);
  if(m){
    const y = parseInt(m[1], 10);
    const mo = String(m[2]).padStart(2, '0');
    const d = String(m[3]).padStart(2, '0');
    return `${y}-${mo}-${d}`;
  }
  m = String(text || '').match(/(\d{1,2})[-/月](\d{1,2})[日号]?/);
  if(m){
    const mo = String(m[1]).padStart(2, '0');
    const d = String(m[2]).padStart(2, '0');
    return `${currentYear}-${mo}-${d}`;
  }
  if(/今天|今日/.test(text)){
    const mo = String(currentMonth + 1).padStart(2, '0');
    const d = String(currentDate).padStart(2, '0');
    return `${currentYear}-${mo}-${d}`;
  }
  if(/明天|次日/.test(text)){
    const target = new Date(now.getTime() + 24 * 3600 * 1000);
    const mo = String(target.getMonth() + 1).padStart(2, '0');
    const d = String(target.getDate()).padStart(2, '0');
    return `${target.getFullYear()}-${mo}-${d}`;
  }
  if(/后天/.test(text)){
    const target = new Date(now.getTime() + 48 * 3600 * 1000);
    const mo = String(target.getMonth() + 1).padStart(2, '0');
    const d = String(target.getDate()).padStart(2, '0');
    return `${target.getFullYear()}-${mo}-${d}`;
  }
  const dayMap = { '日': 0, '天': 0, '七': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6 };
  m = String(text || '').match(/(下周|本周|这周|周|星期)([一二三四五六日天七])/);
  if(m){
    const prefix = m[1];
    const targetDay = dayMap[m[2]];
    let diff = targetDay - currentDayOfWeek;
    if(prefix === '下周'){
      diff += 7;
    } else {
      if(diff < 0) diff += 7;
    }
    const target = new Date(now.getTime() + diff * 24 * 3600 * 1000);
    const mo = String(target.getMonth() + 1).padStart(2, '0');
    const d = String(target.getDate()).padStart(2, '0');
    return `${target.getFullYear()}-${mo}-${d}`;
  }
  const mo = String(currentMonth + 1).padStart(2, '0');
  const d = String(currentDate).padStart(2, '0');
  return `${currentYear}-${mo}-${d}`;
}

function parsePriority(text){

  if(/紧急|加急|严重|立刻|马上|急/.test(t)) return { health: 'danger', healthLab: '紧急', riskRank: 5 };

function extractTitleFromPrompt(text){

  t = t.replace(/(下周|本周|这周)/g, '');
  t = t.replace(/(今天|今日|明天|次日|后天)/g, '');
  t = t.replace(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})[日号]?/g, '');
  t = t.replace(/(\d{1,2})[-/月](\d{1,2})[日号]?/g, '');

    return client ? client : '';
  });
  t = t.replace(/(电话|语音|会上口头|口头|会上|会议)/g, '');
  t = t.replace(/^[，,。；;：:\s]+|[，,。；;：:\s]+$/g, '');
  if(!t || t.length < 2){

}
function normalizeNodeTime(tStr){
  if(!tStr) return '';
  const s = String(tStr).trim();
  const m12 = s.match(/^(?:(\d{1,2}\/\d{1,2})\s+)?(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)$/i);
  if(m12){
    const datePart = m12[1];
    let h = parseInt(m12[2], 10);
    const m = m12[3];
    const ampm = m12[4].toUpperCase();
    if(ampm === 'PM' && h < 12) h += 12;
    if(ampm === 'AM' && h === 12) h = 0;
    const hh = String(h).padStart(2, '0');
    return datePart ? `${datePart} ${hh}:${m}` : `${hh}:${m}`;
  }
  const m24 = s.match(/^(?:(\d{1,2}\/\d{1,2})\s+)?(\d{1,2}):(\d{2})$/);
  if(m24){
    const datePart = m24[1];
    const hh = String(parseInt(m24[2], 10)).padStart(2, '0');
    const m = m24[3];
    return datePart ? `${datePart} ${hh}:${m}` : `${hh}:${m}`;
  }
  return s;
}
function formatNodeOperator(op){
  if(!op && typeof S !== 'undefined' && S && S.me){
    op = S.me;
  }
  if(op === 'pm' || op === 'PM 贤杰' || op === '贤杰') return '贤杰（PM）';
  if(op === 'media' || op === '林可' || op === '媒介 林可') return '林可（媒介）';
  if(op === 'content' || op === '周宁' || op === '内容 周宁') return '周宁（内容）';
  if(typeof op === 'object' && op !== null){
    const n = (op.n || op.name || '').trim();
    if(n === 'PM 贤杰' || n === '贤杰') return '贤杰（PM）';
    if(n === '林可') return '林可（媒介）';
    if(n === '周宁') return '周宁（内容）';
    if(op.name && op.role) return `${op.name}（${op.role}）`;
  }
  if(typeof op === 'string'){
    const s = op.trim();
    if(/^.+（.+）$/.test(s)) return s;
    if(/^.+\(.+\)$/.test(s)) return s.replace(/\((.+)\)/, '（$1）');
    const m = s.match(/^(PM|媒介|内容|运营|执行|商务|策略|数据)\s+(.+)$/);
    if(m) return `${m[2]}（${m[1]}）`;
    const m2 = s.match(/^(.+)\s+(PM|媒介|内容|运营|执行|商务|策略|数据)$/);
    if(m2) return `${m2[1]}（${m2[2]}）`;
    if(s.includes('贤杰')) return '贤杰（PM）';
    if(s.includes('林可')) return '林可（媒介）';
    if(s.includes('周宁')) return '周宁（内容）';
    return s;
  }
  return '贤杰（PM）';
}
function formatManualNodeLabel(n){
  if(!n) return { t: '', text: '' };
  const rawT = String(n.t || '').trim();
  const rawText = String(n.text || '').trim();

  if(rawT.includes(' · ')){
    return { t: rawT, text: rawText };
  }

  const whoField = n.who || n.op;
  if(whoField){
    const tNorm = normalizeNodeTime(rawT);
    const whoNorm = formatNodeOperator(whoField);
    let cleanText = rawText;
    const mPrefix = cleanText.match(/^(.*?)\s*(手动(?:新建|修改)[：:].*)$/);
    if(mPrefix){
      cleanText = mPrefix[2];
    }
    return {
      t: tNorm ? `${tNorm} · ${whoNorm}` : whoNorm,
      text: cleanText
    };
  }

  const m = rawText.match(/^(.*?)\s*(手动(?:新建|修改)[：:].*)$/);
  if(m){
    const extractedWho = m[1].trim();
    const cleanText = m[2];
    const whoNorm = formatNodeOperator(extractedWho || (typeof S !== 'undefined' && S && S.me));
    const tNorm = normalizeNodeTime(rawT);
    return {
      t: tNorm ? `${tNorm} · ${whoNorm}` : whoNorm,
      text: cleanText
    };
  }

  return {
    t: rawT,
    text: rawText
  };
}

function crumbHtml(){
  const sep=ic('chevron');
  if(S.view==='project'){
    const t=S.ptab,w=t.startsWith('wall:')?S.APPS.find(a=>a.id===t.slice(5)):null;
    const roleLab={biz:'商务',media:'媒介',content:'内容',ops:'运营'};
    let sec={today:'今日一页',apps:'工具箱',cust:'客户与干系人',more:'工具箱'}[t];
    if(!sec&&t.startsWith('role:'))sec='工具箱 · '+(roleLab[t.slice(5)]||t);
    if(!sec&&t.startsWith('work:')){const hit=findRoleWork(t.slice(5));sec=hit?hit.work.title:t;}
    if(!sec)sec=w?w.wall:t;
    return '<span>项目空间</span>'+sep+'<strong>'+projectName(S.project)+'</strong>'+sep+'<span>'+esc(sec)+'</span>';
  }
  if(S.view==='bot')return '<span>搭子空间</span>'+sep+'<strong>'+BOT(S.bot).n+'</strong>';
  if(S.view==='studio')return '<span>搭子空间</span>'+sep+'<strong>媒介搭子</strong>'+sep+'<span>skill 工作室</span>';
  if(S.view==='tasks')return '<strong>任务与成果</strong>';
  return '<strong>搭子空间</strong>';
}
function renderTop(){
  const sb=$('#sidebar');
  if(sb){sb.dataset.sel='a';sb.innerHTML=sideHtml();}
  const crumbs=$('#crumbs'), topRight=$('#topright');
  if(crumbs)crumbs.innerHTML=crumbHtml();
  if(topRight)topRight.innerHTML=avatarOf(ME[S.me].n);
}

function changes(d,s){
  if(!s)return {list:[['新增','新 skill「'+(d.name||'未命名')+'」']],review:true};
  const o=pick(s),L=[];let review=false;
  if(o.name!==d.name)L.push(['改','名称：'+o.name+' → '+d.name]);
  if(o.one!==d.one)L.push(['改','一句话']);
  d.steps.filter(x=>!o.steps.includes(x)).forEach(x=>L.push(['新增步骤',x]));
  o.steps.filter(x=>!d.steps.includes(x)).forEach(x=>L.push(['删除步骤',x]));
  d.criteria.filter(x=>!o.criteria.includes(x)).forEach(x=>{L.push(['新增合格标准',x]);review=true;});
  o.criteria.filter(x=>!d.criteria.includes(x)).forEach(x=>{L.push(['删除合格标准',x]);review=true;});
  ['data','kb','tools'].forEach(k=>{const nm={data:'指标',kb:'知识',tools:'工具'}[k];d[k].filter(x=>!o[k].includes(x)).forEach(x=>{L.push(['新增'+nm,x]);review=true;});o[k].filter(x=>!d[k].includes(x)).forEach(x=>L.push(['去掉'+nm,x]));});
  if(o.checker!==d.checker){L.push(['改','检查搭子：'+BOT(o.checker).n+' → '+BOT(d.checker).n]);review=true;}
  if(o.biz.join()!==d.biz.join())L.push(['改','适用业务：'+d.biz.join('、')]);
  if(o.steps.join()!==d.steps.join()&&!L.some(x=>x[0].includes('步骤')))L.push(['改','步骤顺序']);
  return {list:L,review};
}

/* ===== 互派规则（Q2 = B）：平台在接口层拦 ===== */
function chainDepth(){const T=S.task;return T?Math.max(1,...T.subs.map(s=>s.depth)):1;}
function chainEvt(ok,msg){S.chain.events.push({t:S.task?tm():'—',ok,msg});}
function chainTry(kind){
  const T=S.task;
  if(!T||!T.subs.length)return {blocked:true,msg:'还没有互派子任务，先把任务推进到「互派取数」'};
  let r;
  if(kind==='bounce')r={blocked:true,msg:'拦下（规则 2 不回派）：数据搭子想把取数再派回媒介搭子，但媒介搭子已在本链上。要补东西请用「需补充」回给父任务。'};
  else if(kind==='pass')r={blocked:true,msg:'拦下（规则 9）：数据搭子想把 T-1029-07-a 转给策略搭子。退回只能退给派来的那方（媒介搭子），不能转给第三方。'};
  else if(kind==='deep3'){
    if(T.subs.some(s=>s.depth===3))return {blocked:false,msg:'第 3 层子任务已经开过了'};
    T.subs.push({id:'T-1029-07-a1',from:'数据搭子',to:'运营搭子',what:'补 3 篇笔记的发布时间',depth:3,checker:'数据搭子（发起方验收）',st:'已完成 · 数据搭子已验收'});
    log('数据搭子','互派 → 运营搭子：子任务 T-1029-07-a1 补 3 篇笔记的发布时间','深度 3 / 3（到顶）· 运营搭子不在本链上 ✓ · 本链子任务 '+T.subs.length+' / 6',null,1);
    r={blocked:false,msg:'允许：数据搭子 → 运营搭子（第 3 层，已到上限）'};
  }
  else if(kind==='deep4'){
    if(!T.subs.some(s=>s.depth===3))return {blocked:true,msg:'先点「开第 3 层」，再试第 4 层'};
    r={blocked:true,msg:'拦下（规则 1）：运营搭子想再派给内容搭子，会成为第 4 层，超过上限 3 层。请回 PM 搭子重新拆，或在项目群 @ 人。'};
  }
  if(r.blocked)log('平台','拦下互派',r.msg,'bad',0);
  chainEvt(!r.blocked,r.msg);
  return r;
}
function chainBack(reason){
  const T=S.task;
  if(!T||!T.subs.length)return {blocked:true,msg:'还没有互派子任务'};
  if(!reason){const m='拦下（规则 9）：退回必须写理由（指出能力卡哪一条不匹配）';chainEvt(false,m);return {blocked:true,msg:m};}
  S.chain.backs++;
  log('数据搭子','退回 T-1029-07-a 给媒介搭子（第 '+S.chain.backs+' 次）','理由：'+reason,'bad',1);
  let m='退回第 '+S.chain.backs+' 次：已退给派来的媒介搭子，理由「'+reason+'」';
  if(S.chain.backs>=2&&!S.chain.escalated){S.chain.escalated=true;S.chain.resolved=false;log('平台','升级给人：T-1029-07-a 退回 2 次','进今日一页「升级给人」，等isa决定','stop',0);m+='。同一子任务退回 2 次 → 已升级到今日一页（规则 10）';}
  chainEvt(true,m);
  return {blocked:false,msg:m};
}

function todayAtFilter(q){

  return TODAY_AT.filter(n=>{
    const raw=n.toLowerCase();
    const compact=raw.replace(/\s+/g,'');
    return !qq || raw.includes(String(q||'').toLowerCase()) || compact.includes(qq);
  });
}

function paceCostText(n){
  const x=Number(n);
  if(!Number.isFinite(x)) return '—';
  if(Math.abs(x-Math.round(x))<0.001) return '¥'+Math.round(x).toLocaleString('zh-CN');
  return '¥'+(Math.round(x*100)/100).toFixed(2);
}
function paceDue(pack){
  let pct=null;
  if(pack.duePct!=null&&Number.isFinite(Number(pack.duePct))) pct=Number(pack.duePct);
  else if(pack.day!=null&&pack.days) pct=Number(pack.day)/Number(pack.days)*100;
  if(pct==null||!Number.isFinite(pct)) return {k:null,fs:null,pctK:null,pctFs:null};
  return {
    k:(pack.kBudget!=null&&Number.isFinite(Number(pack.kBudget)))?Number(pack.kBudget)*pct/100:null,
    fs:(pack.fsBudget!=null&&Number.isFinite(Number(pack.fsBudget)))?Number(pack.fsBudget)*pct/100:null,
    pctK:(pack.kBudget!=null&&Number.isFinite(Number(pack.kBudget)))?pct:null,
    pctFs:(pack.fsBudget!=null&&Number.isFinite(Number(pack.fsBudget)))?pct:null
  };
}
function todayPacePack(d){
  const sp=d.spend||{}, ef=d.effect||{}, dl=d.delivery||{};
  const asOf=sp.asOf||d.asOf||'—';
  if(S.todayPace==='month'&&d.id==='anker'){
    return {key:'month',asOf:asOf,kUsed:12000,kBudget:80000,fsUsed:4000,fsBudget:180000,posts:2,postsPlan:10,uvCost:20,day:2,days:30};
  }
  if(S.todayPace==='month'){
    return {key:'month',emptyMonth:true,asOf:asOf,kUsed:null,kBudget:null,fsUsed:null,fsBudget:null,posts:null,postsPlan:null,uvCost:null};
  }
  const num=function(v){return (v!=null&&v!==''&&Number.isFinite(Number(v)))?Number(v):null;};
  return {
    key:'po',asOf:asOf,
    kUsed:num(sp.usedK),
    kBudget:num(sp.budgetK),
    fsUsed:num(sp.used),
    fsBudget:num(sp.budgetFS)!=null?num(sp.budgetFS):num(sp.budget),
    posts:dl.published!=null?dl.published:null,
    postsPlan:dl.planned!=null?dl.planned:null,
    uvCost:num(ef.cpuv),
    duePct:num(sp.timePct)
  };
}
function paceBarPct(used,budget){
  const u=Number(used), b=Number(budget);
  if(!Number.isFinite(u)||!Number.isFinite(b)||b<=0) return null;
  return Math.max(0,Math.min(100,u/b*100));
}
function paceTrack(actualPct,duePct,fs){
  const w=actualPct==null?0:Math.max(0,Math.min(100,actualPct));
  const tick=(duePct!=null&&Number.isFinite(Number(duePct)))
    ?'<span class="bxw-tick" style="left:'+Math.max(0,Math.min(100,Number(duePct)))+'%" title="截至今天该花"></span>'
    :'';
  return '<div class="bxw-track'+(fs?' is-fs':'')+'"><i style="width:'+w+'%"></i>'+tick+'</div>';
}
function paceCount(n){
  return (n!=null&&n!==''&&Number.isFinite(Number(n)))?String(n):'—';
}
function paceCollapsedCap(pack){
  const k=yen(pack.kUsed)+'/'+yen(pack.kBudget);

}

    '<div class="bxw-row">'+
      '<div><div class="k">FS 已花</div><div class="v">'+yen(pack.fsUsed)+'<em>/ '+yen(pack.fsBudget)+'</em></div></div>'+
      '<div><div class="k">UV 成本</div><div class="v">'+uv+'</div></div>'+
    '</div>'+
    paceTrack(paceBarPct(pack.fsUsed,pack.fsBudget),due.pctFs,true)+
    sub(due.fs,pack.fsUsed)+

function perm(a){
  const n=ME[S.me].n;
  if(a.owner===n)return '所有者';
  if(a.wall&&S.me==='pm')return '可管理';
  if(a.people.includes(n))return '可见';
  if(a.scope==='proj-view')return '可见';
  if(a.scope==='proj-edit')return '可编辑';
  return null;
}
function scopeLbl(a){return {'proj-view':'项目内可见','proj-edit':'项目内可编辑','people':'指定 '+(a.people.length+1)+' 人','self':'仅自己'}[a.scope];}
function vApps(){

    if(a.bot==='media')return 'media';

  };
  const roleLabOf=rid=>({biz:'商务',media:'媒介',content:'内容',ops:'运营',pm:'PM'})[rid]||'';
  const all=projApps();
  const byRole=S.appsRole==='all'?all:all.filter(a=>roleOf(a)===S.appsRole);
  const mine=byRole.filter(a=>a.owner===n),shared=byRole.filter(a=>a.owner!==n);
  const list={all:byRole,mine,shared}[S.appsFilter]||byRole;

  const pins=Array.isArray(S.pinnedWorks)?S.pinnedWorks.slice():PIN_DEFAULTS.slice();

    if(seen.has(id))return;seen.add(id);

    catalog.push({id,title:hit.work.title,desc:hit.work.desc||'',role:hit.role,kind:hit.work.kind||'ai',pinned:pinSet.has(id)});

      '<div class="cap muted" style="margin:8px 0">'+esc(w.desc||'')+'</div>'+acts+'</div>';
  }).join('');

    }else{

    }

const WORK_CATALOG=()=>{const out=[];for(const rid of Object.keys(ROLE_WORKS)){for(const w of ROLE_WORKS[rid])out.push({role:rid,...w});}return out;};
function roleWorks(id){return ROLE_WORKS[id]||[];}
function findRoleWork(wid){
  for(const rid of Object.keys(ROLE_WORKS)){
    const w=ROLE_WORKS[rid].find(x=>x.id===wid);
    if(w)return {role:rid,work:w};
  }
  const pw=PIN_WORKS.find(x=>x.id===wid);
  if(pw)return {role:'pm',work:pw};
  return null;
}

function isWallable(id){
  if(id==='media-select'||id==='content-sentiment'||id==='hongxiaoxi')return false;
  if(PIN_WORKS.some(w=>w.id===id))return true;
  const hit=findRoleWork(id);
  if(!hit)return false;
  if(hit.work.hang==='apps')return false;
  if(hit.work.wallable===false)return false;
  return true;
}
function unpinnedWallables(){
  const pinned=new Set(S.pinnedWorks||[]);
  const out=[];
  PIN_WORKS.forEach(w=>{if(!pinned.has(w.id)&&isWallable(w.id))out.push(w.id);});
  WORK_CATALOG().forEach(w=>{if(!pinned.has(w.id)&&isWallable(w.id)&&!out.includes(w.id))out.push(w.id);});
  return out;
}

function vPmBoardShell(){
  const d=projectData(S.project);

  const lights=d.lights||[], facts=d.facts||[];
  const effectLight=lights.find(L=>L.id==='effect');
  const deliveryLight=lights.find(L=>L.id==='delivery');
  const effectFact=facts.find(F=>F.tag==='效果');
  const effectNote=effectLight?effectLight.why:(effectFact?effectFact.text:'');
  const deliveryNote=deliveryLight?deliveryLight.why:'';
  const lightRows=lights.map(function(L){
    const color=L.color==='red'?'红':L.color==='amber'?'黄':'绿';
    return '<div><div class="kl">'+esc(L.name)+' <span class="tag '+lightCls(L.color)+'">'+color+'</span></div><div class="kv" style="font-size:18px">'+esc(L.metric||'')+'</div><div class="cap muted">'+esc(L.why||'')+'</div></div>';
  }).join('');
  const lightsBlock='<section class="card pad" style="margin-bottom:16px"><div class="sec-h" style="margin:0 0 12px"><h2 style="margin:0">指标条 · 几盏灯</h2></div>'+(lightRows?'<div class="kpis3">'+lightRows+'</div>':'<div class="cap muted">暂无灯态</div>')+'</section>';
  let spendBlock='<section class="card pad" style="margin-bottom:16px"><div class="sec-h" style="margin:0 0 12px"><h2 style="margin:0">进度条 · KFS 消耗</h2></div><div class="cap muted">暂无消耗数据</div></section>';
  if(d.spend){
    const comparable=sp.used!=null&&sp.budget!=null&&Number(sp.budget)>0;
    const pct=comparable?Number(sp.spendPct!=null?sp.spendPct:Number(sp.used)/Number(sp.budget)*100):null;
    const width=comparable?Math.max(0,Math.min(100,isFinite(pct)?pct:0)):null;
    const dayKey=sp.day20261101!=null?'day20261101':(sp.day20261031!=null?'day20261031':(sp.day20261019!=null?'day20261019':''));
    const dayLabel=dayKey==='day20261101'?'11/01':(dayKey==='day20261031'?'10/31':(dayKey==='day20261019'?'10/19':''));
    const dayText=dayKey?dayLabel+' '+yen(sp[dayKey]):'暂无';
    const spendValue=sp.used!=null?yen(sp.used):'暂无';
    const budgetValue=sp.budget!=null?yen(sp.budget):'暂无';
    spendBlock='<section class="card pad" style="margin-bottom:16px"><div class="sec-h" style="margin:0 0 12px"><h2 style="margin:0">进度条 · KFS 消耗</h2>'+(comparable?'<span class="m">'+width.toFixed(1)+'%</span>':'')+'</div><div class="kv num">'+spendValue+' / '+budgetValue+'</div>'+(comparable?'<div style="height:8px;margin:10px 0 12px;overflow:hidden;border-radius:999px;background:var(--bx-color-brand-tint)"><div style="height:100%;width:'+width+'%;border-radius:999px;background:var(--ds-color-brand)"></div></div>':'')+'<div class="cap muted">F '+(sp.f!=null?yen(sp.f):'暂无')+' · S '+(sp.s!=null?yen(sp.s):'暂无')+' · 日耗 '+dayText+'</div></section>';
  }
  const cell=function(v){return v==null||(d.id==='yameng-pro'&&v==='')?'暂无':esc(String(v));};
  const uv=ef.uv==null?null:Number(ef.uv).toLocaleString('zh-CN');
  const kpiRows=[
    ['去重 CPUV',ef.cpuv,ef.cpuvTarget,effectNote],
    ['去重进店 UV',uv,'',effectNote],
    ['交付已发',dl.published,dl.planned,deliveryNote],
    ['话题完成',dl.topicsDone,dl.topicsTotal,deliveryNote]
  ].map(function(row){return '<tr><td>'+cell(row[0])+'</td><td class="num">'+cell(row[1])+'</td><td class="num">'+cell(row[2])+'</td><td class="cap">'+cell(row[3])+'</td></tr>';}).join('');
  const kpiBlock='<section class="card pad" style="margin-bottom:16px"><div class="sec-h" style="margin:0 0 12px"><h2 style="margin:0">表格 · KPI</h2></div><div class="biz-table-wrap"><table class="tb"><thead><tr><th>指标</th><th>当前</th><th>目标</th><th>说明</th></tr></thead><tbody>'+kpiRows+'</tbody></table></div></section>';
  const p0=d.p0?'<button type="button" style="display:block;width:100%;margin:0 0 8px;padding:12px 14px;text-align:left;border:1px solid #FECACA;border-radius:8px;background:#fff;color:var(--ds-color-text);cursor:pointer" onclick="A.goToday(true)"><strong>P0 · '+esc(d.p0.title||'')+'</strong><div class="cap muted" style="margin-top:4px">'+esc(d.p0.body||d.p0.next||'')+'</div></button>':'';
  const risks=((d.dailyCard||{}).risks||[]).map(function(r){return '<button type="button" style="display:block;width:100%;margin:0 0 8px;padding:12px 14px;text-align:left;border:1px solid var(--ds-color-border);border-radius:8px;background:#fff;color:var(--ds-color-text);cursor:pointer" onclick="A.goToday(true)">'+esc(r)+'</button>';}).join('');
  const riskRows=p0+risks;
  const riskBlock='<section class="card pad" style="margin-bottom:16px"><div class="sec-h" style="margin:0 0 12px"><h2 style="margin:0">列表 · 今日风险</h2></div>'+(riskRows||'<div class="cap muted">暂无风险项</div>')+'</section>';
  const work=PIN_WORKS.find(function(item){return item.id==='pm-board';});
  return vPinnedWorkShell(work,lightsBlock+spendBlock+kpiBlock+riskBlock);
}

  const extraIds=(S.brickExtra&&S.brickExtra[board])||[];
  const base=BOARD_BRICKS(board).filter(function(b){return hidden.indexOf(b.id)<0;});
  const pool=CUSTOM_BRICK_POOL(board);
  const extras=extraIds.map(function(id){
    return pool.find(function(x){return x.id===id;})||BOARD_BRICKS(board).find(function(x){return x.id===id;});
  }).filter(Boolean).filter(function(b){return hidden.indexOf(b.id)<0 && !base.some(function(x){return x.id===b.id;});});
  return base.concat(extras);
}
function brickById(board,id){
  return boardBricksVisible(board).find(function(x){return x.id===id;})
    ||BOARD_BRICKS(board).find(function(x){return x.id===id;})
    ||CUSTOM_BRICK_POOL(board).find(function(x){return x.id===id;})
    ||null;
}

function vBrickPicker(board){
  const hidden=(S.brickHidden&&S.brickHidden[board])||[];
  const extra=(S.brickExtra&&S.brickExtra[board])||[];
  const visibleIds=boardBricksVisible(board).map(function(b){return b.id;});
  const stdHidden=BOARD_BRICKS(board).filter(function(b){return hidden.indexOf(b.id)>=0;});
  const customAvail=CUSTOM_BRICK_POOL(board).filter(function(b){return extra.indexOf(b.id)<0 && visibleIds.indexOf(b.id)<0;});
  const rows=[].concat(
    stdHidden.map(function(b){
      return '<div class="brick-pick-row"><div><b>'+esc(b.title)+'</b> <span class="brick-std-tag">标准·已隐藏</span><div class="cap muted">'+esc(b.summary)+'</div></div>'+
        '<button type="button" class="btn btn-pri sm" onclick="A.unhideBoardBrick(\''+board+'\',\''+b.id+'\')">加回</button></div>';
    }),
    customAvail.map(function(b){
      return '<div class="brick-pick-row"><div><b>'+esc(b.title)+'</b> <span class="brick-custom-tag">自定义</span><div class="cap muted">'+esc(b.summary)+'</div></div>'+
        '<button type="button" class="btn btn-pri sm" onclick="A.addCustomBrick(\''+board+'\',\''+b.id+'\')">添加</button></div>';
    })
  );
  if(!rows.length){
    rows.push('<div class="cap muted">暂无更多积木可加；可先「隐藏」一张标准卡再从这里加回，或添加定制卡（内容岗：明星授权／直播权益）。</div>');
  }
  return '<div class="brick-picker-mask" onclick="A.closeBrickPicker()"><div class="brick-picker" onclick="event.stopPropagation()">'+
    '<h4>加积木</h4><p class="cap muted">标准模板可加回；定制卡不进默认底板</p>'+rows.join('')+
    '<div style="margin-top:12px"><button type="button" class="btn btn-sec sm" onclick="A.closeBrickPicker()">关闭</button></div></div></div>';
}

function mediaStatusTag(light,lab){
  const map={ok:['t-ok','正常'],warn:['t-warn','需关注'],danger:['t-danger','异常']};
  const m=map[light]||['t-muted','信息不足'];
  return '<span class="tag '+m[0]+'">'+esc(lab||m[1])+'</span>';
}
function snapshotText(value){return value==null||value===''||value==='—'?'暂无':String(value);}
function snapshotRoleRows(board,kind,d){
  const plan=(d.execPlanActual||{})[board]||[];
  if(kind==='sources')return d.sources||[];
  if(board==='media'){
    if(kind==='risks')return plan.filter(function(item){return !!item.warn;});
    if(kind==='nodes')return plan.reduce(function(all,item){return all.concat((item.nodes||[]).map(function(node){return Object.assign({title:item.title},node);}));},[]);
    return plan;
  }
  if(board==='content'){
    if(kind==='review')return (d.todayItems||[]).filter(function(item){return item.id==='k-today-mister';});
    if(kind==='issues')return (d.todayItems||[]).filter(function(item){return item.roleTag==='内容';});
    if(kind==='publish-confirm')return plan.filter(function(item){return item.id==='nov-publish';});
    if(kind==='sample-return'||kind==='asset-tune')return [];
    return plan;
  }
  if(kind==='kpi')return d.kpiItems||[];
  if(kind==='todos')return (d.todayItems||[]).filter(function(item){return item.roleTag==='运营';});
  return plan;
}
function snapshotRoleSection(board,sec){
  const d=projectData(S.project);
  const rows=snapshotRoleRows(board,sec.kind,d);
  if(sec.kind==='sources'){
    if(!rows.length)return '<div class="cap muted">暂无</div>';
    return '<div><div class="cap" style="font-weight:600;margin-bottom:6px">来源</div>'+rows.map(function(source){return '<div class="cap" style="margin:4px 0">'+esc(source.name)+' · '+esc(snapshotText(source.asOf||source.note))+'</div>';}).join('')+'</div>';
  }
  if(!rows.length)return '<div class="cap muted">暂无</div>';
  if(sec.kind==='nodes'){
    return '<table class="rpt-table"><thead><tr><th>节点</th><th>计划</th><th>实际</th><th>状态</th></tr></thead><tbody>'+rows.map(function(node){return '<tr><td>'+esc(node.n||'暂无')+'</td><td class="num">'+esc(snapshotText(node.plan))+'</td><td class="num">'+esc(snapshotText(node.actual))+'</td><td>'+esc(snapshotText(node.st))+'</td></tr>';}).join('')+'</tbody></table>';
  }
  if(sec.kind==='overall'){
    return '<table class="rpt-table"><thead><tr><th>维度</th><th>状态</th><th>说明</th></tr></thead><tbody>'+rows.map(function(item){return '<tr><td>'+esc(item.title||item.name)+'</td><td>'+mediaStatusTag(item.light,item.lightLab)+'</td><td class="cap">'+esc(snapshotText(item.summary||item.warn||item.note))+'</td></tr>';}).join('')+'</tbody></table>';
  }
  if(sec.kind==='kpi'){
    return '<table class="rpt-table"><thead><tr><th>指标</th><th>当前</th><th>目标</th><th>说明</th></tr></thead><tbody>'+rows.map(function(item){return '<tr><td>'+esc(item.name)+'</td><td class="num">'+esc(snapshotText(item.actual))+'</td><td class="num">'+esc(snapshotText(item.target))+'</td><td class="cap">'+esc(snapshotText(item.note))+'</td></tr>';}).join('')+'</tbody></table>';
  }
  if(sec.kind==='risks'||sec.kind==='issues'||sec.kind==='todos'){
    return rows.map(function(item,index){return '<div class="rpt-risk"><div class="rid">'+esc(item.id||String(index+1))+'</div><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><strong>'+esc(item.title)+'</strong>'+mediaStatusTag(item.light||item.health,item.lightLab||item.healthLab)+'</div><div class="cap" style="margin-top:6px;line-height:1.55">'+esc(snapshotText(item.warn||item.summary||item.body))+'</div><div class="cap muted" style="margin-top:6px">负责：'+esc(snapshotText(item.assignee||item.owner))+'</div></div></div>';}).join('');
  }
  return '<div class="rpt-quick">'+rows.map(function(item){return '<div class="q"><div class="t">'+esc(item.title)+'</div><div class="s">计划 <b>'+esc(snapshotText(item.plan))+'</b> · 实际 <b>'+esc(snapshotText(item.actual))+'</b></div><div class="s">'+esc(snapshotText(item.summary||item.warn))+'</div></div>';}).join('')+'</div>';
}

  todayMentionPick(id,btn){
    const el=$('#tdayIn-'+id), menu=todayAtMenu(id);
    if(!el||!btn)return;
    const name=btn.getAttribute('data-name')||btn.dataset.name||'';
    const chip=document.createElement('span');
    chip.className='tday-mention';
    chip.contentEditable='false';
    chip.setAttribute('data-mention','@'+name);
    chip.textContent='@'+name;
    const space=document.createTextNode('\u00a0');
    const hit=todayAtCaret(el);
    el.focus();
    if(hit && hit.node && hit.node.parentNode){
      const node=hit.node, parent=node.parentNode;
      const before=node.textContent.slice(0,hit.start);
      const after=node.textContent.slice(hit.end);
      if(before) parent.insertBefore(document.createTextNode(before), node);
      parent.insertBefore(chip, node);
      parent.insertBefore(space, node);
      if(after) parent.insertBefore(document.createTextNode(after), node);
      parent.removeChild(node);
    }else{
      el.appendChild(chip);
      el.appendChild(space);
    }
    try{
      const sel=window.getSelection();
      const range=document.createRange();
      range.setStart(space,1); range.collapse(true);
      sel.removeAllRanges(); sel.addRange(range);
    }catch(err){}
    el.classList.remove('is-empty');
    if(menu){menu.hidden=true;menu.innerHTML='';menu.dataset.idx='0';}
  },

        {t:hm(t0),who:'PM 贤杰',x:changed?'调整指示后派发':'确认派发',det:changed?('派发前调整：派给 '+BOT(al.exec).n+(al.instr?'；指示「'+al.instr+'」':'')+'；截止 '+al.due):'按 PM 搭子拟的内容派发'},
        {t:hm(t0+1),who:BOT(al.exec).n,x:'接单',det:'读应用「负评监控」：代PM 贤杰（可管理）只读'},
        {t:hm(t0+6),who:BOT(al.exec).n,x:'互派 → 数据搭子：子任务 T-1029-08-a 取笔记 2 近 24 小时负评明细',det:'源自告警任务单 T-1029-08；人已首次派发，执行中互派不用再问人（#209 = A）· 深度 2 / 3'},
        {t:hm(t0+14),who:'数据搭子',x:'交回 T-1029-08-a',det:'负评明细 7 条 · '+BOT(al.exec).n+'已验收'}]};
    al.st='sent';closeLayer();render();toast('已派发 T-1029-08 给 '+BOT(al.exec).n+'；执行中它自己找了数据搭子（互派）');
  },
  alertAdjust(){if(!isPM())return;openLayer('modal',alertAdjustModal);},
  alertAdjustSend(){
    const al=S.alert,ex=$('#ad_exec').value;al.instr=$('#ad_instr').value.trim();al.due=$('#ad_due').value.trim()||al.due;
    if(ex==='person'){al.st='person';closeLayer();render();toast('已派给周宁（普通待办）');return;}
    al.exec=ex;A.alertSend(true);
  },
  alertRejectOpen(){S.alert.rejecting=true;render();setTimeout(()=>{const e=$('#alWhy');if(e)e.focus();},30);},
  alertReject(){const r=$('#alWhy').value.trim();if(!r){$('#alErr').innerHTML='<div class="errt">⚠ 驳回要写原因（会回传负责搭子）</div>';return;}S.alert.reason=r;S.alert.st='rejected';S.alert.rejecting=false;render();toast('已驳回，原因回传运营搭子');},
  wallP2(){S.wallP2=true;render();toast('二期功能：@ 其他搭子会生成任务单');},
  appBots(id){openLayer('modal',()=>appBotsModal(id));},
  share(id){openLayer('modal',()=>shareModal(id));},
  setScope(id,v){
    const a=S.APPS.find(x=>x.id===id);
    if(a.wall&&v==='off'){$('#scopeErr').innerHTML='<div class="errt">⚠ 公示期间项目内至少可见；要关闭先下墙</div>';$('#scopeSel').value=a.scope;return;}
    a.scope=v==='off'?(a.people.length?'people':'self'):v;toast('已改为：'+scopeLbl(a));renderLayer();render();
  },
  close(){closeLayer();},
  reset(){fresh();closeLayer();render();window.scrollTo(0,0);toast('已重置');},
  route(n){
    closeLayer();S.wallP2=false;
    if(n===1){S.me='pm';S.view='bots';}
    else if(n===2){S.me='media';A.editSkill('s1');S.studio.step=1;render();toast('身份：林可（媒介搭子管理员）。点「＋ 按笔记互动率分层出价」→ 试跑 → 发布');return;}
    else if(n===3){S.me='pm';S.view='project';S.project='anker';S.ptab='today';S.gview='feed';toast(S.task?'任务单已在下方；去今日一页看「已自动派出」':'点「让 PM 搭子拆任务」：拟好直接派出，不用你点（Q3 = B）');}
    else if(n===4){S.me='pm';S.view='project';S.project='anker';S.ptab='today';S.gview='feed';ensure(3);render();window.scrollTo(0,0);A.openTask('chain');toast('媒介搭子已直接找数据搭子取数（互派）。试试下面几个按钮；关掉后点「▶ 推进」看检查打回 v1、通过 v2');return;}
    else if(n===5){S.me='pm';S.view='project';S.project='anker';S.ptab='today';ensure(7);render();window.scrollTo(0,0);if(S.task.stage===7){A.openApproval();toast('改日预算，标题跟着变；也试试「驳回」，再推进看合格标准跟着 v3 走');}else toast('任务当前不在待审批（'+stgOf(S.task)[1]+'）');return;}
    else if(n===6){S.me='pm';S.view='project';S.project='anker';S.ptab='today';S.gview='feed';ensure(7);if(S.task.stage===7)approveTask('ok',cur().total);render();A.openTask('log');toast('上方「交付记录」每一版一行；下方执行记录里每版都有「交付 投流方案 v n」');return;}
    else if(n===7){S.me='pm';S.view='project';S.project='anker';S.ptab='today';render();window.scrollTo(0,0);setTimeout(()=>{const e=$('#alertTodo');if(e)e.scrollIntoView({block:'center'});},30);toast(S.alert.st==='drafted'?'先点「让 PM 搭子自动派出（试）」看被拦，再点「确认派发」':'这条告警已处理');return;}
    else if(n===8){S.me='pm';S.view='project';S.project='anker';S.ptab='cust';toast('客户与干系人能打开；也看看「负评监控」和「应用」页签');}
    render();window.scrollTo(0,0);
  },
  /* 自检：主流程 + 4 个 bug + 互派规则 */
  selfTest(){
    const R=[];const ok=(c,m)=>R.push([!!c,m]);
    const mv=re=>s=>{const m=s.match(re);return m?Number(m[1]):null;};
    const critTxt=()=>{const d=document.createElement('div');d.innerHTML=critList();return d.textContent;};
    const readAll=()=>{const v=cur().v;const board=mv(/data-plan="(\d+)"/)(boardHtml());const card=mv(/data-plan="(\d+)"/)(taskCard());S.taskTab='out';const out=mv(/data-plan="(\d+)"/)(taskDrawer());return {v,board,card,out};};
    try{
      fresh();S.view='project';S.ptab='today';render();
      newTask();
      ok(S.task.stage===2&&S.task.log.some(l=>/自动派出/.test(l.x)),'PM 搭子拟单后自动派出，不用人点（Q3 = B）');
      ok(pendingMine()===3,'今日一页待处理 = 3 个未完成事项');
      pushTask();
      ok(S.task.subs.length===1&&S.task.subs[0].depth===2,'媒介搭子直接互派数据搭子（Q2 = B）');
      ok(chainTry('bounce').blocked,'回派给链上已有的搭子被拦（规则 2）');
      ok(chainTry('pass').blocked,'退回转给第三方被拦（规则 9）');
      ok(!chainTry('deep3').blocked&&chainDepth()===3,'开第 3 层允许');
      ok(chainTry('deep4').blocked,'第 4 层被拦（规则 1）');
      ok(chainBack('').blocked,'不写理由的退回被拦（规则 9）');
      chainBack('自检理由 1');chainBack('自检理由 2');
      ok(S.chain.escalated===true,'同一子任务退回 2 次升级给人（规则 10）');
      for(let i=0;i<4;i++)pushTask();
      let r=readAll();ok(S.task.stage===7&&r.v===2,'检查打回 v1 后重交，最新为投流方案 v2（实际 v'+r.v+'）');
      ok(r.board===r.v&&r.card===r.v&&r.out===r.v,'版本一致（黑板 v'+r.board+' / 卡片 v'+r.card+' / 抽屉 v'+r.out+'）');
      ok(/投流方案 v2 通过/.test(critTxt()),'合格标准显示 v2 的检查结果');
      S.me='pm';openLayer('approval',approvalModal);
      $('#apVal').value='3200';A.apCheck();
      ok(/¥3,200/.test($('#apTitle').textContent),'审批弹窗标题跟着改成 ¥3,200（bug d）');
      $('#apVal').value='4000';A.apCheck();
      ok(/¥4,000/.test($('#apTitle').textContent)&&$('#apOk').disabled===false,'改成 ¥4,000：标题同步，批准不再拦（#207 暂缓）');
      closeLayer();
      approveTask('reject',0,'自检驳回 v2');
      ok(/投流方案 v2 已被驳回/.test(critTxt())&&!/v2 通过/.test(critTxt()),'驳回后合格标准不再显示旧的「通过」');
      pushTask();
      ok(cur().v===3&&/待检查（投流方案 v3）/.test(critTxt()),'出 v3 后合格标准显示「待检查（投流方案 v3）」（bug b）');
      pushTask();
      ok(/投流方案 v3 通过/.test(critTxt()),'v3 检查通过后显示 v3 的结果');
      approveTask('reject',0,'自检驳回 v3');
      ok(/投流方案 v3 已被驳回/.test(critTxt())&&!/v2/.test(critTxt()),'v3 被驳回后，合格标准不出现 v2（bug b）');
      pushTask();pushTask();
      ok(cur().v===4&&/投流方案 v4 通过/.test(critTxt()),'再交 v4，合格标准跟到 v4');
      approveTask('edit',2600);
      ok(S.task.stage===8&&cur().v===5,'改后批准生成 v5 并完成');
      ok(S.task.plans.every(p=>S.task.log.some(l=>l.x.indexOf('交付 投流方案 v'+p.v+'（')===0)),'每一版（v1–v'+S.task.plans.length+'）都有交付记录（bug c）');
      render();S.taskTab='log';openLayer('drawer',taskDrawer);
      ok(document.querySelectorAll('#dlvTable tr[data-dlv]').length===S.task.plans.length,'执行记录上方交付汇总表行数 = 版本数');
      closeLayer();
      A.ptab('cust');ok(!!$('#custTable')&&/isa/.test($('#app').textContent),'「客户与干系人」能打开并有内容');
      A.ptab('cust');ok(!!$('#custTable'),'「客户与干系人」能打开并有内容');
      A.alertAuto();ok(S.alert.st==='drafted'&&S.alert.autoTry,'告警任务单：PM 搭子自动派出被拦（#209 = A）');
      A.alertSend();ok(S.alert.st==='sent'&&S.task2.log.some(l=>/^互派/.test(l.x)),'人首次派发后，执行中搭子互派不用再问人');
      A.versions('s1');A.close();ok($('#layer').children.length===0&&!document.querySelector('.ov'),'关闭版本历史抽屉后无残留遮罩');
      A.openTask('chain');A.versions('s1');A.close();ok(!document.querySelector('.ov'),'抽屉切换后关闭，无残留遮罩');
      ok(S.task.log.concat(S.task2.log).every(l=>/^\d{2}:\d{2}$/.test(l.t)),'执行记录时间全部为 24 小时制 HH:MM');
    }catch(e){ok(false,'自检出错：'+e.message);}
    fresh();render();
    const pass=R.filter(x=>x[0]).length;
    openLayer('modal',simpleModal('自检结果 · '+pass+' / '+R.length+' 通过','<ul class="checks">'+R.map(x=>'<li>'+(x[0]?'<span class="ok">✓</span>':'<span class="no">✕</span>')+esc(x[1])+'</li>').join('')+'</ul><p class="cap muted">自检会重置当前状态。</p>'));
  }
};
/* v4 左侧目录的两个入口（只调用 v3 已有的动作，不改 v3 逻辑） */
A.sideProj=function(p){S.view='project';closeLayer();if(p==='yameng-pro'||p==='anker')S.ptab='today';A.proj(p);window.scrollTo(0,0);};
A.sideRecent=function(i){const r=sideRecents()[i];if(!r)return;if(r.live||r.sub)A.openTask(r.sub?'chain':'log');else if(r.live2)A.openTask2();else toast('完整执行记录见 T-1029-07、T-1029-08');};
A.toggleBizFilter=function(button){
  button.parentElement.querySelectorAll('button').forEach(item=>{
    const selected=item===button;
    item.className=selected?'btn btn-sec sm on':'btn btn-txt sm';
    item.setAttribute('aria-pressed',String(selected));
  });
};
window.A=A;
window.S=S;
window.render=render;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.layer)closeLayer();if(e.key==='Escape'&&S.moreOpen){S.moreOpen=false;render();}});
document.addEventListener('click',()=>{if(S&&S.moreOpen){S.moreOpen=false;render();}});
render();
})();
</script>
